[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-fraud-detection"
version = "1.0.0"
description = "GNN-based illicit Bitcoin transaction detection on the Elliptic dataset (GCN vs GAT vs GraphSAGE vs GIN vs MLP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "torch_geometric>=2.6",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "mlflow>=2.20,<4.0",
    "captum>=0.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
gnn-fraud = "gnn_fraud_detection.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "N803", "N806", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/gnn_fraud_detection"]
omit = ["*/__init__.py"]